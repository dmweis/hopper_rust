base:
  dynamixel_port: "/dev/dynamixel"
  face_port: "/dev/hopper_face"
tts_service_config:
  azure_api_key: ""
  eleven_labs_api_key: ""
  cache_dir_path: "/var/cache/hopper/audio_cache"
  audio_repository_path: "/etc/hopper/audio/"
imu:
  serial_port: "/dev/hopper_imu"
  up_axis: [0.0, 0.0, 1.0]
  upside_down_angle_degrees: 125.0
  righted_angle_degrees: 100.0
  status_topic: "hopper/status/imu"
lidar:
  serial_port: "/dev/rplidar"
  state_topic: "hopper/lidar/state"
  point_cloud_topic: "hopper/lidar/point_cloud"
  start_state_on: false
zenoh:
  connect:
    - "tcp/homepi:7447"
    - "tcp/dork:7447"
    - "udp/dork:7448"
  listen:
    - "tcp/0.0.0.0:7447"
    - "udp/0.0.0.0:7448"
camera:
  id: 0
  image_topic: "hopper/camera/image"
  image_width: 320
  image_height: 240
openai:
  api_key: "API_KEY"
  wakeword_topic_prefix: "hopper_wakeword"
